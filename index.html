<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F4F6F8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="골프여행">
<title>2027 골프여행</title>
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F4F6F8; --card:#FFFFFF; --ink:#0B1B2B; --muted:#5B6B7A; --line:#E6EAEE; --chip:#EEF1F4;
  --brand:#087443; --brand-2:#12B76A; --brand-soft:#E6F6EE; --brand-ink:#062B1A;
  --accent:#12B76A; --accent-ink:#062B1A; --accent-strong:#0E9F5D; --mint:#3DDC97; --navy:#0B1B2B;
  --gold:#B7791F; --gold-soft:#FBF1DC; --silver:#6B7280; --bronze:#9A5B2B;
  --danger:#C2410C; --danger-soft:#FDEEE5; --info:#2E6BE6; --info-soft:#EAF1FD; --on-info:#FFFFFF;
  --shadow:0 1px 2px rgba(11,27,43,.04),0 6px 18px rgba(11,27,43,.06);
  --radius:20px;
  --today-bg:#EEF9F3;
  --num:"Noto Sans KR",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0B131A; --card:#15212C; --ink:#E8EEF3; --muted:#93A3B1; --line:#22303C; --chip:#1D2A36;
    --brand:#3DDC97; --brand-2:#12B76A; --brand-soft:#123326; --brand-ink:#062B1A;
    --accent:#12B76A; --accent-ink:#062B1A; --accent-strong:#3DDC97; --mint:#3DDC97; --navy:#1B3247;
    --gold:#F2B544; --gold-soft:#3A2D12; --silver:#A5ADB8; --bronze:#D08A52;
    --danger:#FB8A5A; --danger-soft:#3B1D12; --info:#7AA2FF; --info-soft:#18233F; --on-info:#0B131A;
    --shadow:0 1px 2px rgba(0,0,0,.35);
    --today-bg:#12291F;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0B131A; --card:#15212C; --ink:#E8EEF3; --muted:#93A3B1; --line:#22303C; --chip:#1D2A36;
  --brand:#3DDC97; --brand-2:#12B76A; --brand-soft:#123326; --brand-ink:#062B1A;
  --accent:#12B76A; --accent-ink:#062B1A; --accent-strong:#3DDC97; --mint:#3DDC97; --navy:#1B3247;
  --gold:#F2B544; --gold-soft:#3A2D12; --silver:#A5ADB8; --bronze:#D08A52;
  --danger:#FB8A5A; --danger-soft:#3B1D12; --info:#7AA2FF; --info-soft:#18233F; --on-info:#0B131A;
  --shadow:0 1px 2px rgba(0,0,0,.35);
  --today-bg:#12291F;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font-family:"Noto Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-size:15px;line-height:1.45;
  padding-bottom:calc(76px + env(safe-area-inset-bottom))}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:560px;margin:0 auto;padding:0 16px}

/* 헤더 */
.hero{background:linear-gradient(160deg,#14532d,#166534 55%,#1f7a43);color:#fff;padding:calc(14px + env(safe-area-inset-top)) 0 18px}
.hero .top{position:relative;text-align:center;padding:0 46px}
.hero h1{font-size:21px;font-weight:900;margin:0;letter-spacing:-.3px;display:inline-flex;align-items:center;gap:8px}
.hero h1 svg{width:28px;height:28px;flex:none}
.hero h1 svg.flip{transform:scaleX(-1)}
.iconbtn.abs{position:absolute;right:0;top:50%;transform:translateY(-50%)}
#heroExtra{text-align:center}
.hero .sub{opacity:.85;font-size:13.5px;margin-top:2px}
.hero .dday{display:inline-flex;align-items:center;gap:6px;margin-top:10px;background:rgba(255,255,255,.14);border-radius:999px;padding:4px 12px;font-size:13px;font-weight:700}
.iconbtn{border:0;background:rgba(255,255,255,.16);color:#fff;width:38px;height:38px;border-radius:12px;display:grid;place-items:center;cursor:pointer;flex:none}
.iconbtn svg{width:20px;height:20px}
.iconbtn.spin svg{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.notice{margin-top:12px;background:rgba(255,255,255,.12);border-radius:12px;padding:8px 12px;font-size:13.5px;white-space:pre-wrap}
.mode{margin-top:10px;font-size:12px;background:#fde68a;color:#5b3d00;border-radius:8px;padding:5px 10px;display:inline-block}

main{padding-top:14px}
.sect-title{font-size:13px;font-weight:700;color:var(--muted);margin:18px 2px 8px;letter-spacing:.2px}
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px;margin-bottom:12px;border:1px solid var(--line)}
.card h3{margin:0 0 2px;font-size:16.5px;font-weight:800}
.card .meta{color:var(--muted);font-size:13px}
.row{display:flex;align-items:center;gap:8px}
.between{justify-content:space-between}
.empty{color:var(--muted);text-align:center;padding:26px 10px;font-size:14px}
.chip{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:3px 10px;font-size:12.5px;font-weight:700;background:var(--brand-soft);color:var(--brand)}
.chip.gold{background:var(--gold-soft);color:var(--gold)}
.chip.gray{background:var(--line);color:var(--muted)}
.chip.red{background:var(--danger-soft);color:var(--danger)}
.chip.blue{background:var(--info-soft);color:var(--info)}
.today{outline:2px solid var(--brand-2);outline-offset:-1px;background:var(--today-bg)}

/* 일정 타임라인 */
.tl{list-style:none;margin:10px 0 0;padding:0}
.tl li{display:grid;grid-template-columns:54px 1fr;gap:10px;padding:8px 0;border-top:1px dashed var(--line)}
.tl li:first-child{border-top:0}
.tl .t{font-weight:800;color:var(--brand);font-variant-numeric:tabular-nums}
.tl .n{color:var(--muted);font-size:13px}
.tl li.ev-round,.tl li.ev-stay{border-top:0;border-radius:10px;padding:8px 10px;margin:4px -10px}
.tl li.ev-round{background:var(--brand-soft)}
.tl li.ev-stay{background:var(--info-soft)}
.tl li.ev-stay .t{color:var(--info)}
.evtag{display:inline-block;font-size:11.5px;font-weight:800;border-radius:6px;padding:1px 7px;margin-right:6px;vertical-align:1px}
.evtag.round{background:var(--brand);color:var(--brand-ink)}
.evtag.stay{background:var(--info);color:var(--card)}
.editrow.ev-round{border-color:var(--brand-2);background:var(--brand-soft)}
.editrow.ev-stay{border-color:var(--info);background:var(--info-soft)}
.todaycard{border-color:var(--brand-2)}
.tc-me{display:flex;align-items:center;gap:8px;margin:10px 0 2px;font-size:13px;color:var(--muted);font-weight:700}
.tc-me select{flex:1;min-width:0;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:7px 10px;font-size:15px;color:var(--ink)}
.tc-mine{background:var(--gold-soft);border-radius:10px;padding:8px 10px;font-size:14px;margin-top:8px}
.tc-sec{margin-top:10px;display:grid;gap:8px}
.tc-line{display:flex;align-items:flex-start;gap:8px}
.tc-line>div{min-width:0;display:grid;gap:4px}
.tc-group{display:flex;gap:8px;align-items:baseline;font-size:14px;padding:6px 10px;border-radius:10px;background:var(--bg);flex-wrap:wrap}
.tc-group.mine{outline:2px solid var(--gold)}
.tc-group .tee{font-weight:800;color:var(--brand);font-variant-numeric:tabular-nums}
.maps{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.maps a{font-size:12.5px;font-weight:700;text-decoration:none;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:3px 9px}
.name.me{border-color:var(--gold);background:var(--gold-soft);font-weight:700}
.sharebtn{margin-top:12px}
.fee{font-weight:700;color:var(--brand);font-variant-numeric:tabular-nums}
.photo-slots{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pslot{display:grid;gap:6px}
.pslot img{width:100%;aspect-ratio:3/2;object-fit:cover;border-radius:10px;border:1px solid var(--line);background:var(--bg)}
.pempty{aspect-ratio:3/2;border:1px dashed var(--line);border-radius:10px;display:grid;place-items:center;color:var(--muted);font-size:13px}
.pslot label{text-align:center;cursor:pointer}
.ocr{margin-top:10px;background:var(--brand-soft);border-radius:10px;padding:10px 12px;font-size:14px}
.ocr ul{margin:6px 0 0;padding-left:18px}
.sg.auto{border-color:var(--brand);background:var(--brand-soft)}
.photomodal{place-items:start center;overflow-y:auto}
.photomodal .pbox{background:var(--card);border-radius:18px;padding:14px;width:100%;max-width:560px}
.photomodal figure{margin:12px 0 0}
.photomodal figcaption{font-weight:800;margin-bottom:6px}
.photomodal img{width:100%;border-radius:10px;border:1px solid var(--line);display:block}
.golfline{margin-top:10px;background:var(--brand-soft);border-radius:12px;padding:8px 12px;font-size:13.5px;color:var(--brand);font-weight:700}

/* 라운딩 조편성 */
.groups{display:grid;gap:8px;margin-top:10px}
.group{border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.group .g{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.group .g b{font-size:14px}
.group .tee{font-weight:800;color:var(--brand);font-variant-numeric:tabular-nums}
.names{display:flex;flex-wrap:wrap;gap:6px}
.name{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:4px 10px;font-size:14px}
.name small{color:var(--muted);margin-left:3px}

/* 세그먼트 */
.seg{display:flex;gap:6px;overflow-x:auto;padding:2px 0 8px;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:none;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 14px;font-weight:700;font-size:14px;cursor:pointer;color:var(--muted)}
.seg button.on{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}

/* 순위표 */
table.rank{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
table.rank th{font-size:12px;color:var(--muted);font-weight:700;text-align:right;padding:6px 4px;border-bottom:1px solid var(--line)}
table.rank th:nth-child(1),table.rank th:nth-child(2){text-align:left}
table.rank td{padding:10px 4px;border-bottom:1px solid var(--line);text-align:right;font-size:15px}
table.rank tr:last-child td{border-bottom:0}
table.rank td.nm{text-align:left;font-weight:700}
table.rank td.rk{text-align:left;width:38px}
table.rank td.net{font-weight:900;color:var(--brand)}
table.rank tr.out td{color:var(--muted)}
.medal{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;font-weight:900;font-size:13px;background:var(--line);color:var(--muted)}
.medal.m1{background:var(--gold);color:#fff}.medal.m2{background:var(--silver);color:#fff}.medal.m3{background:var(--bronze);color:#fff}
.sub2{display:block;font-size:11.5px;color:var(--muted);font-weight:500}
.matrix td,.matrix th{text-align:center!important}
.matrix td.nm{text-align:left!important}
.podium{display:grid;grid-template-columns:1fr 1.15fr 1fr;gap:8px;align-items:end;margin:4px 0 12px}
.pod{background:var(--card);border:1px solid var(--line);border-radius:14px;text-align:center;padding:10px 6px;box-shadow:var(--shadow)}
.pod .p{font-size:22px}
.pod b{display:block;font-size:15px;margin-top:2px}
.pod span{font-size:12.5px;color:var(--muted)}
.pod.first{padding:16px 6px;border-color:var(--gold)}
.note{font-size:12.5px;color:var(--muted);margin-top:8px}

/* 경비 */
.money-hero{display:grid;gap:4px}
.money-hero .big{font-size:30px;font-weight:900;letter-spacing:-.5px;font-variant-numeric:tabular-nums}
.bar{height:12px;border-radius:999px;background:var(--brand-soft);overflow:hidden;margin:10px 0 6px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--brand-2),var(--brand));border-radius:999px}
.bar.over i{background:var(--danger)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
.stat{background:var(--bg);border-radius:12px;padding:8px 10px}
.stat span{font-size:12px;color:var(--muted);display:block}
.stat b{font-size:14.5px;font-variant-numeric:tabular-nums}
.list{list-style:none;margin:0;padding:0}
.list li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.list li:first-child{border-top:0}
.list .l{min-width:0}
.list .l b{display:block;font-weight:700;overflow:hidden;text-overflow:ellipsis}
.list .l small{color:var(--muted);font-size:12.5px}
.list .r{font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
.plus{color:var(--brand)}.minus{color:var(--danger)}
.catbar{display:grid;grid-template-columns:86px 1fr auto;gap:8px;align-items:center;font-size:13.5px;margin:6px 0}
.catbar .b{height:8px;border-radius:99px;background:var(--brand-soft);overflow:hidden}
.catbar .b i{display:block;height:100%;background:var(--brand)}

/* 하단 탭 */
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:20}
nav.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(6,1fr)}
table.members th:nth-child(2),table.members td:nth-child(2){text-align:center;width:56px}
table.members th:nth-child(3),table.members td.bg{text-align:left}
nav.tabs button{border:0;background:none;padding:8px 0 7px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;white-space:nowrap;font-weight:700;color:var(--muted);cursor:pointer}
nav.tabs svg{width:23px;height:23px}
nav.tabs button.on{color:var(--brand)}

/* 관리자 폼 */
.field{display:grid;gap:4px;margin-bottom:10px}
.field label{font-size:12.5px;color:var(--muted);font-weight:700}
.inp,select.inp,textarea.inp{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 11px;font-size:16px;outline:none}
.inp:focus{border-color:var(--brand)}
textarea.inp{min-height:70px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.btn{border:0;border-radius:12px;padding:12px 16px;font-weight:800;cursor:pointer;background:var(--brand);color:var(--brand-ink);font-size:15px}
.btn.ghost{background:var(--brand-soft);color:var(--brand)}
.btn.danger{background:var(--danger-soft);color:var(--danger)}
.btn.small{padding:7px 12px;font-size:13.5px;border-radius:10px}
.btn.block{width:100%}
.btn:disabled{opacity:.5}
.editrow{border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px;background:var(--card)}
.editrow .hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-weight:800;font-size:14px}
.pick{display:flex;flex-wrap:wrap;gap:6px}
.pick button{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:6px 10px;font-size:14px;cursor:pointer;color:var(--muted)}
.pick button.on{background:var(--brand);color:var(--brand-ink);border-color:var(--brand);font-weight:700}
.savebar{position:sticky;bottom:calc(66px + env(safe-area-inset-bottom));padding:10px 0;background:linear-gradient(transparent,var(--bg) 30%);z-index:5}
.scorein{display:grid;grid-template-columns:1fr 74px 62px 52px;gap:8px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.scorein:first-of-type{border-top:0}
.scorein .inp{padding:8px;text-align:center}
.scorein .nt{text-align:center;font-weight:900;color:var(--brand)}
.scorehead{display:grid;grid-template-columns:1fr 74px 62px 52px;gap:8px;font-size:12px;color:var(--muted);font-weight:700;text-align:center}
.scorehead span:first-child{text-align:left}
.banner{background:var(--gold-soft);color:var(--gold);border-radius:12px;padding:12px;font-size:14px;margin-bottom:12px}
.toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:#111a14;color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;transition:.25s;z-index:50;max-width:88vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.err{background:#9a3412}
.center{text-align:center}
.modal{position:fixed;inset:0;background:rgba(8,16,11,.5);display:grid;place-items:center;z-index:60;padding:16px}
.modal .box{background:var(--card);border-radius:18px;padding:18px;width:100%;max-width:340px;box-shadow:var(--shadow)}
.modal p{margin:2px 0 16px;font-size:15.5px;font-weight:500}

/* ===== 테마: B 페어웨이 스포츠 ===== */
body{padding-bottom:calc(100px + env(safe-area-inset-bottom))}
table.rank td:not(.nm),.tl .t,.group .tee,.tc-group .tee,.medal,.money-hero .big,.stat b,.list .r,.catbar b,.scorein .nt,.pod span,.fee{font-family:var(--num)}

/* 상단 */
.hero{background:transparent;color:var(--ink);padding:calc(18px + env(safe-area-inset-top)) 0 4px}
.hero .top{display:flex;align-items:center;justify-content:space-between;text-align:left;padding:0}
.hero h1{font-size:17px;gap:6px;letter-spacing:-.3px}
.hero h1 svg{width:22px;height:22px}
.iconbtn{background:var(--card);color:var(--ink);width:40px;height:40px;border-radius:12px;box-shadow:var(--shadow)}
.hero-main{display:flex;align-items:flex-end;gap:12px;margin-top:10px}
.hero .dday{display:block;background:none;padding:0;margin:0;border-radius:0;font-family:var(--num);font-size:64px;font-weight:800;line-height:.85;color:var(--accent-strong);letter-spacing:-1px;white-space:nowrap}
.hero .sub{opacity:1;color:var(--muted);font-size:13px;line-height:1.45;margin:0;padding-bottom:3px}
#heroExtra{text-align:left}
.notice{background:var(--card);color:var(--ink);box-shadow:var(--shadow);border-radius:14px}

/* 카드·칩 */
.card{border:0;border-radius:var(--radius);box-shadow:var(--shadow)}
.today{outline:2px solid var(--accent);outline-offset:-2px;background:var(--today-bg)}
.chip.gray{background:var(--chip);color:var(--muted)}
.sect-title{color:var(--ink);font-size:14px;font-weight:900}

/* 탭(세그먼트)·버튼 */
.seg button{border:0;background:var(--card);box-shadow:var(--shadow);border-radius:12px;color:var(--muted)}
.seg button.on{background:var(--navy);color:#fff}
.btn{background:var(--accent);color:var(--accent-ink);border-radius:14px}
.btn.ghost{background:var(--card);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.btn.danger{background:var(--danger-soft);color:var(--danger);box-shadow:none}
.pick button{background:var(--card)}
.pick button.on{background:var(--navy);border-color:var(--navy);color:#fff}

/* 순위 */
.medal{width:28px;height:28px;border-radius:8px;font-size:16px;font-weight:800;background:var(--chip);color:var(--ink)}
.medal.m1{background:var(--accent);color:var(--accent-ink)}
.medal.m2,.medal.m3{background:var(--navy);color:#fff}
table.rank td{font-size:16px}
table.rank td.nm{font-size:15px}
table.rank td.net{color:var(--ink);font-weight:800;font-size:20px}
.pod{border:0;border-radius:18px}
.pod.first{background:var(--navy);color:#fff}
.pod.first span{color:var(--mint)}
.pod span{font-size:15px}

/* 일정 */
.tl li{border-top:1px solid var(--line)}
.tl .t{font-size:18px;font-weight:700;color:var(--ink)}
.tl li.ev-round{background:var(--brand-soft)}
.evtag.round{background:var(--accent);color:var(--accent-ink)}
.evtag.stay{background:var(--info);color:var(--on-info)}
.tl li.ev-stay .t{color:var(--info)}

/* 오늘 카드: 남색 */
.todaycard{background:var(--navy);color:#fff;outline:0}
.todaycard h3{color:#fff}
.todaycard .chip{background:rgba(61,220,151,.16);color:var(--mint)}
.todaycard .meta{color:rgba(255,255,255,.68)}
.todaycard .tc-me{color:rgba(255,255,255,.72)}
.todaycard .tc-me select{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.18);color:#fff}
.todaycard .tc-me select option{color:#0B1B2B}
.todaycard .tc-mine{background:rgba(61,220,151,.12);box-shadow:inset 0 0 0 1.5px var(--mint);color:#fff}
.todaycard .tc-group{background:rgba(255,255,255,.07);color:#fff}
.todaycard .tc-group .tee{color:var(--mint);font-size:20px}
.todaycard .fee{color:var(--mint)}
.todaycard .evtag.round{background:var(--mint);color:#062B1A}
.todaycard .evtag.stay{background:#5B8DEF;color:#fff}

/* 라운딩 */
.group{border:0;background:var(--bg);border-radius:14px}
.group .tee{font-size:20px;color:var(--ink)}
.name{background:var(--card);border-color:var(--line)}

/* 경비 */
.money-hero .big{font-size:46px;font-weight:800;letter-spacing:0}
.bar{height:12px;background:var(--brand-soft)}
.bar i{background:var(--accent)}
.stat{background:var(--bg);border-radius:14px}
.stat b{font-size:19px;font-weight:700}
.list .r{font-size:18px;font-weight:700}
.catbar b{font-size:16px}
.catbar .b i{background:var(--accent)}

/* 관리자 */
.editrow{border-color:transparent;box-shadow:var(--shadow);border-radius:18px}
.scorein .nt{font-size:20px}

/* 하단 메뉴: 떠 있는 막대 */
nav.tabs{left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom));padding:6px;border:0;border-radius:22px;background:var(--card);box-shadow:0 10px 30px rgba(11,27,43,.16)}
nav.tabs .in{gap:2px}
nav.tabs button{border-radius:14px;padding:7px 0 6px;color:var(--muted)}
nav.tabs button.on{background:var(--navy);color:#fff}
nav.tabs button.on svg{color:var(--mint)}
.savebar{bottom:calc(92px + env(safe-area-inset-bottom))}
.toast{bottom:calc(104px + env(safe-area-inset-bottom))}

/* 상단 배치: D-day 왼쪽 작게, 제목 가운데 크게 */
.hero .dday{font-family:"Noto Sans KR",sans-serif;font-size:17px;font-weight:900;color:var(--ink);letter-spacing:-.3px;line-height:1.2}
.hero-title{text-align:center;margin-top:6px}
.hero-title h1{font-family:var(--num);font-size:36px;font-weight:800;color:var(--accent-strong);gap:8px;letter-spacing:-.5px;line-height:1.1}
.hero-title h1 svg{width:30px;height:30px}
.hero-title .sub{margin-top:4px;padding:0}

/* 라운딩 탭 조 이름 옆 티타임 */
.group .g b{font-size:14px}
.group .tee{font-family:inherit;font-size:14px;font-weight:700;color:var(--brand)}
.tee-none{font-size:14px;font-weight:500;color:var(--muted)}

/* 일정: 시간과 내용을 세로 가운데로 */
.tl li{align-items:center}
.tl .t{line-height:1.2}
</style>
</head>
<body>

    <div class="top">
      <span class="dday" id="dday"></span>
      <button class="iconbtn" id="refresh" aria-label="새로고침">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
      </button>

    </div>

  </div>
</header>

<main class="wrap" id="view"></main>

<nav class="tabs">
  <div class="in">
    <button data-tab="schedule" class="on">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4.5" width="18" height="16" rx="3"/><path d="M3 9.5h18M8 2.5v4M16 2.5v4"/></svg>일정</button>
    <button data-tab="rounds">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 21V3l11 4.5L6 12"/><ellipse cx="12" cy="20.5" rx="8" ry="1.6"/></svg>라운딩</button>
    <button data-tab="scores">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0z"/><path d="M17 5h3v2a3 3 0 0 1-3 3M7 5H4v2a3 3 0 0 0 3 3"/></svg>스코어</button>
    <button data-tab="money">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="6" width="19" height="13" rx="3"/><path d="M2.5 10.5h19M16.5 15h2"/></svg>경비</button>
    <button data-tab="members">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><path d="M16 4.6a3.5 3.5 0 0 1 0 6.8M18 14a6.5 6.5 0 0 1 3.5 6"/></svg>참가자</button>
    <button data-tab="admin">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09a1.65 1.65 0 0 0-1.08-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09a1.65 1.65 0 0 0 1.51-1.08 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>관리자</button>
  </div>
